<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090A0F" />
    <title>Pas de connexion · Le Club by LCS</title>
    <!-- Page gardée sur le téléphone par public/sw.js : tout est ici, rien n'est chargé du réseau. -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { min-height: 100%; }
      body {
        background:
          radial-gradient(120% 60% at 0% 0%, rgba(250, 148, 255, 0.16), transparent 60%),
          radial-gradient(100% 50% at 100% 100%, rgba(201, 128, 177, 0.14), transparent 60%),
          #090a0f;
        color: #f4eeff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
      }
      main {
        width: 100%;
        max-width: 400px;
        display: grid;
        gap: 16px;
        justify-items: center;
        text-align: center;
        padding: 28px 20px;
        border-radius: 24px;
        background: rgba(25, 30, 57, 0.55);
        border: 1px solid rgba(250, 148, 255, 0.35);
        box-shadow: inset 0 0 40px rgba(250, 148, 255, 0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
      p { font-size: 15px; line-height: 1.45; color: rgba(244, 238, 255, 0.75); }
      button {
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 999px;
        background: #defd62;
        color: #090a0f;
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        box-shadow: 0 12px 30px rgba(222, 253, 98, 0.35);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icones/icone-192.png" alt="" />
      <h1>Pas de connexion</h1>
      <p>Le Club a besoin d'internet pour afficher ton programme. Vérifie ta connexion, puis réessaie.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
