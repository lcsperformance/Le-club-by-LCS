# Vérifications automatiques à chaque pull request et à chaque mise à jour de main.
# Si une étape échoue, la pull request affiche une croix rouge : ne pas fusionner.
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Tests et compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Base PostgreSQL pour les tests de sécurité par ligne (RLS).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Valeurs fictives : la compilation et les tests n'appellent jamais Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: cle-de-test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Fichiers de configuration (config/*.json)
        run: npm run verifier-config

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests (calculs, sécurité par ligne, composants)
        run: npm test

      - name: Compilation
        run: npm run build

      - name: Navigateur pour les tests d'affichage
        run: npx playwright install --with-deps chromium

      - name: Affichage sur téléphone (320, 360, 390 px)
        run: npm run test:e2e
